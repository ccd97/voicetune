<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" role="img" aria-label="voicetune pipeline">
  <title>voicetune pipeline: preprocess, diarize, scrub, validate, segment, filter, label, finetune, infer</title>

  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F07A45"/>
    </marker>
    <style>
      .bg     { fill: #0D1117; }
      .frame  { fill: none; stroke: #F07A45; stroke-width: 1.5; stroke-dasharray: 6 6; stroke-opacity: 0.55; }
      .card   { fill: #161B22; stroke: #F07A45; stroke-width: 2; }
      .num    { fill: #F07A45; }
      .numT   { fill: #0D1117; font: 700 20px 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .title  { fill: #FBF4E9; font: 700 24px 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .sub    { fill: #FFB28C; font: 500 15px 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .edge   { stroke: #FBF4E9; stroke-width: 2.5; fill: none; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="740"/>
  <rect class="frame" x="20" y="20" width="1240" height="700" rx="28"/>

  <g>
    <rect class="card" x="100" y="100" width="320" height="120" rx="22"/>
    <circle class="num" cx="136" cy="136" r="20"/>
    <text class="numT" x="136" y="143" text-anchor="middle">1</text>
    <text class="title" x="170" y="143">Preprocess</text>
    <text class="sub"   x="170" y="172">Normalize audio</text>
    <text class="sub"   x="170" y="192">to standard format</text>
  </g>
  <g>
    <rect class="card" x="480" y="100" width="320" height="120" rx="22"/>
    <circle class="num" cx="516" cy="136" r="20"/>
    <text class="numT" x="516" y="143" text-anchor="middle">2</text>
    <text class="title" x="550" y="143">Diarize</text>
    <text class="sub"   x="550" y="172">Transcribe speech</text>
    <text class="sub"   x="550" y="192">and split by speaker</text>
  </g>
  <g>
    <rect class="card" x="860" y="100" width="320" height="120" rx="22"/>
    <circle class="num" cx="896" cy="136" r="20"/>
    <text class="numT" x="896" y="143" text-anchor="middle">3</text>
    <text class="title" x="930" y="143">Scrub</text>
    <text class="sub"   x="930" y="172">Drop turns with</text>
    <text class="sub"   x="930" y="192">PII data</text>
  </g>

  <g>
    <rect class="card" x="860" y="310" width="320" height="120" rx="22"/>
    <circle class="num" cx="896" cy="346" r="20"/>
    <text class="numT" x="896" y="353" text-anchor="middle">4</text>
    <text class="title" x="930" y="353">Validate</text>
    <text class="sub"   x="930" y="382">Fix mislabeled or</text>
    <text class="sub"   x="930" y="402">low-confidence turns</text>
  </g>
  <g>
    <rect class="card" x="480" y="310" width="320" height="120" rx="22"/>
    <circle class="num" cx="516" cy="346" r="20"/>
    <text class="numT" x="516" y="353" text-anchor="middle">5</text>
    <text class="title" x="550" y="353">Segment</text>
    <text class="sub"   x="550" y="382">Cut audio into</text>
    <text class="sub"   x="550" y="402">per-turn clips</text>
  </g>
  <g>
    <rect class="card" x="100" y="310" width="320" height="120" rx="22"/>
    <circle class="num" cx="136" cy="346" r="20"/>
    <text class="numT" x="136" y="353" text-anchor="middle">6</text>
    <text class="title" x="170" y="353">Filter</text>
    <text class="sub"   x="170" y="382">Drop low-quality</text>
    <text class="sub"   x="170" y="402">clips</text>
  </g>

  <g>
    <rect class="card" x="100" y="520" width="320" height="120" rx="22"/>
    <circle class="num" cx="136" cy="556" r="20"/>
    <text class="numT" x="136" y="563" text-anchor="middle">7</text>
    <text class="title" x="170" y="563">Label</text>
    <text class="sub"   x="170" y="592">Tag each speaker</text>
    <text class="sub"   x="170" y="612">as me or other</text>
  </g>
  <g>
    <rect class="card" x="480" y="520" width="320" height="120" rx="22"/>
    <circle class="num" cx="516" cy="556" r="20"/>
    <text class="numT" x="516" y="563" text-anchor="middle">8</text>
    <text class="title" x="550" y="563">Finetune</text>
    <text class="sub"   x="550" y="592">Train a LoRA</text>
    <text class="sub"   x="550" y="612">adapter on GPU</text>
  </g>
  <g>
    <rect class="card" x="860" y="520" width="320" height="120" rx="22"/>
    <circle class="num" cx="896" cy="556" r="20"/>
    <text class="numT" x="896" y="563" text-anchor="middle">9</text>
    <text class="title" x="930" y="563">Infer</text>
    <text class="sub"   x="930" y="592">Try out the</text>
    <text class="sub"   x="930" y="612">fine-tuned voice</text>
  </g>

  <path class="edge" d="M 420 160 L 474 160" marker-end="url(#arrow-dark)"/>
  <path class="edge" d="M 800 160 L 854 160" marker-end="url(#arrow-dark)"/>
  <path class="edge" d="M 1020 220 C 1020 265, 1020 265, 1020 310" marker-end="url(#arrow-dark)"/>
  <path class="edge" d="M 860 370 L 806 370" marker-end="url(#arrow-dark)"/>
  <path class="edge" d="M 480 370 L 426 370" marker-end="url(#arrow-dark)"/>
  <path class="edge" d="M 260 430 C 260 475, 260 475, 260 520" marker-end="url(#arrow-dark)"/>
  <path class="edge" d="M 420 580 L 474 580" marker-end="url(#arrow-dark)"/>
  <path class="edge" d="M 800 580 L 854 580" marker-end="url(#arrow-dark)"/>
</svg>
